<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMAGE FORGE 0.2</title>
<style>
:root{--bg:#111318;--panel:#1a1e26;--panel2:#222834;--text:#f5f7fb;--muted:#9ba6b7;--line:#343c4a;--accent:#f2b84b;--danger:#ff6b6b;--good:#7bd8a8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:22px 20px 8px;max-width:1180px;margin:auto}
h1{margin:0;font-size:28px;letter-spacing:.04em}
.tag{color:var(--muted);margin-top:4px}
main{max-width:1180px;margin:auto;padding:16px 20px 40px;display:grid;grid-template-columns:360px 1fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.controls{position:sticky;top:12px;height:max-content}
label{display:block;margin:12px 0 5px;color:#d9deea;font-weight:650}
input,select,button{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quality-row{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center}
.quality-row input[type="range"]{padding:0}
.quality-number{display:flex;align-items:center;gap:5px}
.quality-number input{padding:9px 7px;text-align:right}
.quality-number span{color:var(--muted);font-weight:700}
.check{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--muted)}
.check input{width:auto}
button{cursor:pointer;font-weight:750;margin-top:10px}
.primary{background:var(--accent);color:#17120a;border-color:transparent}
.ghost{background:transparent}
.help{font-size:12px;color:var(--muted);margin-top:5px}
.preset-note{margin-top:10px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#151922;color:#c9d1df;font-size:12px}
.safe-note{margin-top:8px;padding:9px 10px;border-radius:10px;background:#18251f;border:1px solid #315240;color:#bde8ce;font-size:12px}
.drop{border:2px dashed #566175;border-radius:18px;padding:34px 18px;text-align:center;color:var(--muted);transition:.15s}
.drop.drag{border-color:var(--accent);background:#292515}
.drop strong{color:var(--text);font-size:18px}
#fileInput{display:none}
.toolbar{display:flex;gap:8px;margin:12px 0;align-items:center}
.toolbar button{width:auto;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.thumb{position:relative;background:#0c0e12;display:grid;place-items:center;overflow:hidden}
.thumb.checker{background-color:#fff;background-image:linear-gradient(45deg,#e9e9e9 25%,transparent 25%),linear-gradient(-45deg,#e9e9e9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e9e9e9 75%),linear-gradient(-45deg,transparent 75%,#e9e9e9 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.thumb img{width:100%;height:100%;display:block}
.safe-guide{position:absolute;left:10%;right:10%;top:14.8%;bottom:14.8%;border:2px dashed rgba(242,184,75,.95);box-shadow:0 0 0 9999px rgba(0,0,0,.18);pointer-events:none}
.safe-guide:after{content:"SAFE 1920×950";position:absolute;left:6px;top:5px;font-size:10px;font-weight:800;color:#1b160d;background:rgba(242,184,75,.95);padding:2px 5px;border-radius:5px}
.meta{padding:10px}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.small{color:var(--muted);font-size:12px}
.status{margin-top:8px;color:var(--muted);font-size:13px}
.empty{padding:50px 10px;text-align:center;color:var(--muted)}
.badge{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:#253044;color:#c9d8ff;font-size:11px;vertical-align:middle}
footer{max-width:1180px;margin:0 auto;padding:0 20px 28px;color:var(--muted);font-size:12px;text-align:center}
footer .footer-inner{border-top:1px solid var(--line);padding-top:18px}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
footer .privacy{margin-top:4px}
@media(max-width:800px){main{grid-template-columns:1fr}.controls{position:static}.quality-row{grid-template-columns:1fr 78px}}
</style>
</head>
<body>
<header>
  <h1>IMAGE FORGE <span style="color:var(--accent)">0.2</span></h1>
  <div class="tag">Drop. Resize. Convert. Done. — 画像はブラウザ内だけで処理します。</div>
</header>

<main>
<section class="card controls">
  <label>プリセット</label>
  <select id="preset">
    <option value="journal">Raika & Rei Journal 2400×1350</option>
    <option value="note">note サムネ 1280×670</option>
    <option value="wpwide">WordPress 汎用ワイド 1200×675</option>
    <option value="og">OGP / SNS 1200×630</option>
    <option value="square">正方形 1080×1080</option>
    <option value="web">Web軽量 長辺1600px</option>
    <option value="custom">カスタム</option>
  </select>
  <div class="preset-note" id="presetNote"></div>

  <label>サイズ</label>
  <div class="row">
    <input id="width" type="number" min="1" placeholder="幅">
    <input id="height" type="number" min="1" placeholder="高さ">
  </div>

  <label>フィット</label>
  <select id="fit">
    <option value="cover">Cover（余白なし・切り抜き）</option>
    <option value="contain">Contain（全体保持・余白あり）</option>
    <option value="stretch">Stretch（変形）</option>
  </select>
  <div class="help" id="fitHelp"></div>

  <label>出力形式</label>
  <select id="format">
    <option value="image/webp">WebP</option>
    <option value="image/jpeg">JPEG</option>
    <option value="image/png">PNG</option>
  </select>

  <label>品質</label>
  <div class="quality-row">
    <input id="quality" type="range" min="20" max="100" step="1" value="85" aria-label="品質スライダー">
    <div class="quality-number">
      <input id="qualityNumber" type="number" min="20" max="100" step="1" value="85" inputmode="numeric" aria-label="品質の数値入力">
      <span>%</span>
    </div>
  </div>
  <div class="help">バーでも数字でも調整できます（20〜100%）。</div>

  <div class="check">
    <input id="showGuide" type="checkbox" checked>
    <span>安全範囲ガイドを表示</span>
  </div>
  <div class="safe-note" id="safeNote">Journal：重要な文字・顔は中央1920×950px以内に。</div>

  <label>ファイル名</label>
  <input id="prefix" value="image" placeholder="image">
  <div class="check">
    <input id="keepName" type="checkbox">
    <span>元のファイル名を使う</span>
  </div>

  <button class="primary" id="convert">全部変換して保存</button>
  <button class="ghost" id="clear">一覧をクリア</button>
  <div class="status" id="status">待機中</div>
</section>

<section class="card">
  <label class="drop" id="drop" for="fileInput">
    <strong>画像をここにドロップ</strong><br>
    またはタップして複数選択<br>
    <span class="small">PNG / JPEG / WebP など</span>
  </label>
  <input id="fileInput" type="file" accept="image/*" multiple>
  <div class="toolbar">
    <button id="add">＋ 画像を追加</button>
    <span class="small" id="count"></span>
  </div>
  <div id="grid" class="grid"><div class="empty">まだ画像がありません 🖼️</div></div>
</section>
</main>

<footer>
  <div class="footer-inner">
    <div><strong>IMAGE FORGE 0.2</strong> · Made by Raika &amp; Rei · <a href="https://github.com/raika-rei-lab/image-forge" target="_blank" rel="noopener noreferrer">GitHub</a></div>
    <div class="privacy">画像はブラウザ内で処理され、外部サーバーへ送信されません。</div>
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);
let files = [];
const previewUrls = new Map();

const presets = {
  journal:{
    w:2400,h:1350,fit:"cover",format:"image/webp",q:85,
    note:"Raika & Rei Journal用。16:9 / WebP。テーマの高密度表示まで想定した元画像サイズ。",
    safe:true
  },
  note:{
    w:1280,h:670,fit:"cover",format:"image/jpeg",q:85,
    note:"noteサムネ用。1280×670。端に重要な文字を置かないのがおすすめ。",
    safe:false
  },
  wpwide:{
    w:1200,h:675,fit:"cover",format:"image/webp",q:85,
    note:"一般的な16:9のWordPressワイド画像。Journal本番用は上の2400×1350を推奨。",
    safe:false
  },
  og:{
    w:1200,h:630,fit:"cover",format:"image/jpeg",q:85,
    note:"OGP / SNS共有向け。約1.91:1。中央寄せのデザインが安全。",
    safe:false
  },
  square:{
    w:1080,h:1080,fit:"cover",format:"image/webp",q:85,
    note:"正方形SNS・プロフィール系画像向け。",
    safe:false
  },
  web:{
    w:1600,h:"",fit:"contain",format:"image/webp",q:80,
    note:"元の縦横比を保ち、長辺1600px相当に軽量化。高さは自動計算。",
    safe:false
  }
};

const human = n => n < 1024 ? n+" B" : n < 1048576 ? (n/1024).toFixed(1)+" KB" : (n/1048576).toFixed(2)+" MB";
const extFor = t => t==="image/jpeg" ? "jpg" : t==="image/png" ? "png" : "webp";

function previewUrl(file){
  if(!previewUrls.has(file)) previewUrls.set(file, URL.createObjectURL(file));
  return previewUrls.get(file);
}

function currentTargetRatio(){
  const w = parseInt($("#width").value);
  const h = parseInt($("#height").value);
  return (w && h) ? w/h : 16/10;
}

function render(){
  $("#count").textContent = files.length ? files.length+" 枚" : "";
  if(!files.length){
    $("#grid").innerHTML = '<div class="empty">まだ画像がありません 🖼️</div>';
    return;
  }

  const ratio = currentTargetRatio();
  const fit = $("#fit").value;
  const format = $("#format").value;
  const guide = $("#showGuide").checked && $("#preset").value==="journal";

  $("#grid").innerHTML = "";
  files.forEach((f,i)=>{
    const d = document.createElement("div");
    d.className = "item";

    const thumb = document.createElement("div");
    thumb.className = "thumb" + ((fit==="contain" && format!=="image/jpeg") ? " checker" : "");
    thumb.style.aspectRatio = ratio;
    if(fit==="contain" && format==="image/jpeg") thumb.style.background = "#fff";

    const img = document.createElement("img");
    img.src = previewUrl(f);
    img.alt = "";
    img.style.objectFit = fit==="stretch" ? "fill" : fit;
    thumb.appendChild(img);

    if(guide){
      const g = document.createElement("div");
      g.className = "safe-guide";
      thumb.appendChild(g);
    }

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = '<div class="name">'+escapeHtml(f.name)+'</div><div class="small">'+human(f.size)+'</div><button data-i="'+i+'" class="remove">削除</button>';

    d.appendChild(thumb);
    d.appendChild(meta);
    $("#grid").appendChild(d);
  });

  document.querySelectorAll(".remove").forEach(b=>{
    b.onclick = ()=>{
      const removed = files.splice(+b.dataset.i,1)[0];
      const u = previewUrls.get(removed);
      if(u) URL.revokeObjectURL(u);
      previewUrls.delete(removed);
      render();
    };
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function addFiles(list){
  files.push(...[...list].filter(f=>f.type.startsWith("image/")));
  render();
}

function updateFitHelp(){
  const fit = $("#fit").value;
  const msg = fit==="cover"
    ? "余白なし。枠いっぱいに表示するため、上下または左右が切れることがあります。"
    : fit==="contain"
    ? "画像全体を残します。比率が違うと余白が入ります。JPEGでは余白は白になります。"
    : "指定サイズへ強制変形します。通常はおすすめしません。";
  $("#fitHelp").textContent = msg;
}

function applyPreset(){
  const key = $("#preset").value;
  const p = presets[key];

  if(!p){
    $("#presetNote").textContent = "幅・高さ・形式などを自由に設定できます。";
    $("#safeNote").style.display = "none";
    $("#showGuide").disabled = true;
    $("#showGuide").checked = false;
    updateFitHelp();
    render();
    return;
  }

  $("#width").value = p.w;
  $("#height").value = p.h;
  $("#fit").value = p.fit;
  $("#format").value = p.format;
  $("#quality").value = p.q;
  $("#qualityNumber").value = p.q;
  $("#presetNote").textContent = p.note;
  $("#safeNote").style.display = p.safe ? "block" : "none";
  $("#showGuide").disabled = !p.safe;
  if(!p.safe) $("#showGuide").checked = false;
  else $("#showGuide").checked = true;

  updateFitHelp();
  render();
}

$("#fileInput").onchange = e=>{
  addFiles(e.target.files);
  e.target.value = "";
};
$("#add").onclick = ()=>$("#fileInput").click();
$("#clear").onclick = ()=>{
  previewUrls.forEach(u=>URL.revokeObjectURL(u));
  previewUrls.clear();
  files = [];
  render();
  $("#status").textContent = "一覧をクリアしました";
};
function setQuality(value, source){
  let q = Number(value);
  if(!Number.isFinite(q)) return;
  q = Math.min(100, Math.max(20, Math.round(q)));
  $("#quality").value = q;
  $("#qualityNumber").value = q;
  if(source==="number") $("#qualityNumber").value = q;
}

$("#quality").oninput = e=>setQuality(e.target.value,"range");
$("#qualityNumber").oninput = e=>{
  if(e.target.value==="") return;
  const q = Number(e.target.value);
  if(Number.isFinite(q) && q>=20 && q<=100) $("#quality").value = Math.round(q);
};
$("#qualityNumber").onchange = e=>setQuality(e.target.value || 85,"number");
$("#preset").onchange = applyPreset;
$("#fit").onchange = ()=>{updateFitHelp();render();};
$("#format").onchange = render;
$("#width").oninput = render;
$("#height").oninput = render;
$("#showGuide").onchange = render;

const drop = $("#drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{
  e.preventDefault();
  drop.classList.add("drag");
}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{
  e.preventDefault();
  drop.classList.remove("drag");
}));
drop.addEventListener("drop",e=>addFiles(e.dataTransfer.files));

async function loadImage(file){
  return await createImageBitmap(file);
}

async function convertOne(file,index){
  const img = await loadImage(file);
  let tw = parseInt($("#width").value);
  let th = parseInt($("#height").value);

  if(!tw && !th){
    tw = img.width;
    th = img.height;
  }else if(tw && !th){
    th = Math.round(img.height*tw/img.width);
  }else if(!tw && th){
    tw = Math.round(img.width*th/img.height);
  }

  const c = document.createElement("canvas");
  c.width = tw;
  c.height = th;
  const ctx = c.getContext("2d");
  const fit = $("#fit").value;
  const type = $("#format").value;

  if(type==="image/jpeg"){
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,tw,th);
  }

  let sx=0,sy=0,sw=img.width,sh=img.height,dx=0,dy=0,dw=tw,dh=th;

  if(fit==="contain"){
    const r = Math.min(tw/img.width,th/img.height);
    dw = img.width*r;
    dh = img.height*r;
    dx = (tw-dw)/2;
    dy = (th-dh)/2;
  }else if(fit==="cover"){
    const r = Math.max(tw/img.width,th/img.height);
    sw = tw/r;
    sh = th/r;
    sx = (img.width-sw)/2;
    sy = (img.height-sh)/2;
  }

  ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);

  const q = +$("#quality").value/100;
  const blob = await new Promise(res=>c.toBlob(res,type,q));
  img.close?.();

  const base = $("#keepName").checked
    ? file.name.replace(/\.[^.]+$/,"")
    : ($("#prefix").value||"image")+"_"+String(index+1).padStart(3,"0");

  return {blob:blob,name:base+"."+extFor(type)};
}

$("#convert").onclick = async()=>{
  if(!files.length){
    $("#status").textContent = "画像を追加してください";
    return;
  }

  $("#convert").disabled = true;
  try{
    for(let i=0;i<files.length;i++){
      $("#status").textContent = "変換中 "+(i+1)+"/"+files.length+"…";
      const out = await convertOne(files[i],i);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(out.blob);
      a.download = out.name;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      await new Promise(r=>setTimeout(r,120));
    }
    $("#status").textContent = "完了："+files.length+" 枚 ✨";
  }catch(e){
    console.error(e);
    $("#status").textContent = "変換に失敗しました: "+e.message;
  }finally{
    $("#convert").disabled = false;
  }
};

applyPreset();
</script>
</body>
</html>
