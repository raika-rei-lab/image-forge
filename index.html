<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMAGE FORGE 0.1</title>
<style>
:root{--bg:#111318;--panel:#1a1e26;--panel2:#222834;--text:#f5f7fb;--muted:#9ba6b7;--line:#343c4a;--accent:#f2b84b;--danger:#ff6b6b}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:22px 20px 8px;max-width:1180px;margin:auto} h1{margin:0;font-size:28px;letter-spacing:.04em} .tag{color:var(--muted);margin-top:4px}
main{max-width:1180px;margin:auto;padding:16px 20px 40px;display:grid;grid-template-columns:340px 1fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.controls{position:sticky;top:12px;height:max-content}
label{display:block;margin:12px 0 5px;color:#d9deea;font-weight:650} input,select,button{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--muted)}.check input{width:auto}
button{cursor:pointer;font-weight:750;margin-top:10px}.primary{background:var(--accent);color:#17120a;border-color:transparent}.ghost{background:transparent}
.drop{border:2px dashed #566175;border-radius:18px;padding:34px 18px;text-align:center;color:var(--muted);transition:.15s}.drop.drag{border-color:var(--accent);background:#292515}.drop strong{color:var(--text);font-size:18px}
#fileInput{display:none}.toolbar{display:flex;gap:8px;margin:12px 0}.toolbar button{width:auto;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.item{background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.thumb{aspect-ratio:16/10;background:#0c0e12;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:contain}.meta{padding:10px}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}.small{color:var(--muted);font-size:12px}
.status{margin-top:8px;color:var(--muted);font-size:13px}.empty{padding:50px 10px;text-align:center;color:var(--muted)}
@media(max-width:800px){main{grid-template-columns:1fr}.controls{position:static}}
</style>
</head>
<body>
<header>
  <h1>IMAGE FORGE <span style="color:var(--accent)">0.1</span></h1>
  <div class="tag">Drop. Resize. Convert. Done. — 画像はブラウザ内だけで処理します。</div>
</header>
<main>
<section class="card controls">
  <label>プリセット</label>
  <select id="preset">
    <option value="custom">カスタム</option>
    <option value="note">note サムネ 1280×670</option>
    <option value="square">正方形 1080×1080</option>
    <option value="og">OG画像 1200×630</option>
    <option value="web">Web軽量 長辺1600px</option>
  </select>

  <label>サイズ</label>
  <div class="row"><input id="width" type="number" min="1" placeholder="幅"><input id="height" type="number" min="1" placeholder="高さ"></div>

  <label>フィット</label>
  <select id="fit"><option value="contain">Contain（余白）</option><option value="cover">Cover（切り抜き）</option><option value="stretch">Stretch（変形）</option></select>

  <label>出力形式</label>
  <select id="format"><option value="image/webp">WebP</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select>

  <label>品質 <span id="qv">85</span>%</label>
  <input id="quality" type="range" min="20" max="100" value="85">

  <label>ファイル名</label>
  <input id="prefix" value="image" placeholder="image">
  <div class="check"><input id="keepName" type="checkbox"><span>元のファイル名を使う</span></div>

  <button class="primary" id="convert">全部変換して保存</button>
  <button class="ghost" id="clear">一覧をクリア</button>
  <div class="status" id="status">待機中</div>
</section>

<section class="card">
  <label class="drop" id="drop" for="fileInput">
    <strong>画像をここにドロップ</strong><br>またはタップして複数選択<br><span class="small">PNG / JPEG / WebP など</span>
  </label>
  <input id="fileInput" type="file" accept="image/*" multiple>
  <div class="toolbar"><button id="add">＋ 画像を追加</button><span class="small" id="count"></span></div>
  <div id="grid" class="grid"><div class="empty">まだ画像がありません 🖼️</div></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
let files=[];
const human=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB";
const extFor=t=>t==="image/jpeg"?"jpg":t==="image/png"?"png":"webp";

function render(){
  $("#count").textContent=files.length?`${files.length} 枚`:"";
  if(!files.length){$("#grid").innerHTML='<div class="empty">まだ画像がありません 🖼️</div>';return}
  $("#grid").innerHTML="";
  files.forEach((f,i)=>{
    const d=document.createElement("div"); d.className="item";
    const url=URL.createObjectURL(f);
    d.innerHTML=`<div class="thumb"><img src="${url}"></div><div class="meta"><div class="name">${escapeHtml(f.name)}</div><div class="small">${human(f.size)}</div><button data-i="${i}" class="remove">削除</button></div>`;
    $("#grid").appendChild(d);
  });
  document.querySelectorAll(".remove").forEach(b=>b.onclick=()=>{files.splice(+b.dataset.i,1);render()});
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function addFiles(list){files.push(...[...list].filter(f=>f.type.startsWith("image/")));render()}
$("#fileInput").onchange=e=>{addFiles(e.target.files);e.target.value=""};
$("#add").onclick=()=>$("#fileInput").click();
$("#clear").onclick=()=>{files=[];render();$("#status").textContent="一覧をクリアしました"};
$("#quality").oninput=e=>$("#qv").textContent=e.target.value;
$("#preset").onchange=e=>{
 const p=e.target.value;
 if(p==="note"){width.value=1280;height.value=670;format.value="image/jpeg";quality.value=90}
 if(p==="square"){width.value=1080;height.value=1080}
 if(p==="og"){width.value=1200;height.value=630;format.value="image/jpeg";quality.value=90}
 if(p==="web"){width.value=1600;height.value="";format.value="image/webp";quality.value=80}
 $("#qv").textContent=quality.value;
};
const drop=$("#drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("drag")}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("drag")}));
drop.addEventListener("drop",e=>addFiles(e.dataTransfer.files));

async function loadImage(file){
 const bmp=await createImageBitmap(file); return bmp;
}
async function convertOne(file,index){
 const img=await loadImage(file);
 let tw=parseInt(width.value), th=parseInt(height.value);
 if(!tw&&!th){tw=img.width;th=img.height}
 else if(tw&&!th){th=Math.round(img.height*tw/img.width)}
 else if(!tw&&th){tw=Math.round(img.width*th/img.height)}
 const c=document.createElement("canvas"); c.width=tw;c.height=th;
 const ctx=c.getContext("2d");
 const fit=$("#fit").value;
 if($("#format").value==="image/jpeg"){ctx.fillStyle="#fff";ctx.fillRect(0,0,tw,th)}
 let sx=0,sy=0,sw=img.width,sh=img.height,dx=0,dy=0,dw=tw,dh=th;
 if(fit==="contain"){
   const r=Math.min(tw/img.width,th/img.height);dw=img.width*r;dh=img.height*r;dx=(tw-dw)/2;dy=(th-dh)/2;
 } else if(fit==="cover"){
   const r=Math.max(tw/img.width,th/img.height);sw=tw/r;sh=th/r;sx=(img.width-sw)/2;sy=(img.height-sh)/2;
 }
 ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);
 const type=$("#format").value,q=+$("#quality").value/100;
 const blob=await new Promise(res=>c.toBlob(res,type,q));
 img.close?.();
 const base=$("#keepName").checked?file.name.replace(/\.[^.]+$/,""):($("#prefix").value||"image")+"_"+String(index+1).padStart(3,"0");
 return {blob,name:base+"."+extFor(type)};
}
$("#convert").onclick=async()=>{
 if(!files.length)return $("#status").textContent="画像を追加してください";
 $("#convert").disabled=true;
 try{
   for(let i=0;i<files.length;i++){
     $("#status").textContent=`変換中 ${i+1}/${files.length}…`;
     const out=await convertOne(files[i],i);
     const a=document.createElement("a");a.href=URL.createObjectURL(out.blob);a.download=out.name;a.click();
     setTimeout(()=>URL.revokeObjectURL(a.href),3000);
     await new Promise(r=>setTimeout(r,120));
   }
   $("#status").textContent=`完了：${files.length} 枚 ✨`;
 }catch(e){console.error(e);$("#status").textContent="変換に失敗しました: "+e.message}
 finally{$("#convert").disabled=false}
};
render();
</script>
</body></html>
